    path: LocalSearchEngine.Core/Crawling/Reporting/CrawlObserver.cs
    startLine: 13
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Reporting
  summary: >-
    The single sink for crawl events: each <code>On…</code> callback both writes the run log and updates

    the running <xref href="LocalSearchEngine.Core.Crawling.Reporting.CrawlStats" data-throw-if-not-resolved="false"></xref>, and the page-outcome callbacks additionally push a fresh

    snapshot to the <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter" data-throw-if-not-resolved="false"></xref> driving the live display. Centralizing this here

    keeps the crawl engine free of logging and presentation concerns. See <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlObserver" data-throw-if-not-resolved="false"></xref>

    for what each callback signifies.
  example: []
  syntax:
    content: 'internal sealed class CrawlObserver : ICrawlObserver'
    content.vb: Friend NotInheritable Class CrawlObserver Implements ICrawlObserver
