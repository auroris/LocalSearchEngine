  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    The crawl-wide set of URL identities already accepted into the frontier. <xref href="LocalSearchEngine.Core.Crawling.Pipeline.VisitedSet.TryMarkSeen(System.String)" data-throw-if-not-resolved="false"></xref>

    is the single atomic dedup decision: with several workers discovering the same link at once, a

    check-then-add would let two of them both enqueue it, so membership and insertion are one

    <xref href="System.Collections.Concurrent.ConcurrentDictionary%602.TryAdd(%600%2c%601)" data-throw-if-not-resolved="false"></xref>. Keys are normalized URLs

    (<xref href="LocalSearchEngine.Core.Crawling.Policies.UrlNormalizer" data-throw-if-not-resolved="false"></xref> output), compared case-insensitively like the old frontier.
