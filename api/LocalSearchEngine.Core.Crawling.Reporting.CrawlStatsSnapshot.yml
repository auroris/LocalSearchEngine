  summary: >-
    An immutable point-in-time view of a crawl's <xref href="LocalSearchEngine.Core.Crawling.Reporting.CrawlStats" data-throw-if-not-resolved="false"></xref>, handed to reporters so a

    live display can render from a stable copy rather than reaching into the mutable tally.
  example: []
  syntax:
    content: public CrawlStatsSnapshot(CrawlPhase Phase, int Discovered, int Indexed, int Unchanged, int NoIndex, int SkippedType, int SkippedSize, int LowQualityText, int Redirected, int Gone, int Disallowed, int Failed, long LinksFound, int RemovedBanned, int RemovedStale, TimeSpan Elapsed)
    parameters:
    - id: Phase
      type: LocalSearchEngine.Core.Crawling.Reporting.CrawlPhase
      description: The phase the crawl was in when the snapshot was taken.
    - id: Discovered
      type: System.Int32
      description: Unique URLs discovered so far (the crawl frontier; the progress denominator).
    - id: Indexed
      type: System.Int32
      description: Pages whose content was (re-)indexed (the progress numerator).
    - id: Unchanged
      type: System.Int32
      description: Pages unchanged since the last crawl (304 or identical hash).
    - id: NoIndex
      type: System.Int32
      description: Pages fetched but left unindexed by a noindex directive.
    - id: SkippedType
      type: System.Int32
      description: Pages skipped for an unsupported content type or failed sniff.
    - id: SkippedSize
      type: System.Int32
      description: Pages skipped for exceeding the size limit.
    - id: LowQualityText
      type: System.Int32
      description: Pages (PDFs) left unindexed because their extracted text was unusable.
    - id: Redirected
      type: System.Int32
      description: URLs that resolved to a redirect, canonical alias, or duplicate.
    - id: Gone
      type: System.Int32
      description: Pages found gone (404/410) and removed from the index.
    - id: Disallowed
      type: System.Int32
      description: URLs not fetched because robots.txt disallowed them.
    - id: Failed
      type: System.Int32
      description: URLs that errored or returned a non-success status.
    - id: LinksFound
      type: System.Int64
      description: Total outlinks seen across pages, duplicates included.
    - id: RemovedBanned
      type: System.Int32
      description: Indexed URLs removed because robots.txt now disallows them.
    - id: RemovedStale
      type: System.Int32
      description: Indexed URLs pruned because a completed crawl no longer reaches them.
    - id: Elapsed
      type: System.TimeSpan
      description: Wall-clock time since the crawl started.
    content.vb: Public Sub New(Phase As CrawlPhase, Discovered As Integer, Indexed As Integer, Unchanged As Integer, NoIndex As Integer, SkippedType As Integer, SkippedSize As Integer, LowQualityText As Integer, Redirected As Integer, Gone As Integer, Disallowed As Integer, Failed As Integer, LinksFound As Long, RemovedBanned As Integer, RemovedStale As Integer, Elapsed As TimeSpan)
