  summary: Ranks semantic and keyword candidates based on query similarity and search settings configuration.
  example: []
  syntax:
    content: public static List<SearchResultItem> Rank(IEnumerable<VectorCandidate> vectorHits, IEnumerable<KeywordCandidate> keywordHits, string query, SearchSettings settings, IReadOnlyDictionary<string, string?>? titles = null, IReadOnlyDictionary<string, DocKind>? docKinds = null)
