  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Searching
  summary: Ranks semantic and keyword candidates based on query similarity and search settings configuration.
  example: []
  syntax:
    content: public static List<SearchResultItem> Rank(IEnumerable<VectorCandidate> vectorHits, IEnumerable<KeywordCandidate> keywordHits, string query, SearchSettings settings, IReadOnlyDictionary<string, string?>? titles = null, IReadOnlyDictionary<string, DocKind>? docKinds = null, IReadOnlyDictionary<string, double>? authorities = null, IEnumerable<InboundLinkCandidate>? inboundLinkHits = null)
    parameters:
    - id: vectorHits
      type: System.Collections.Generic.IEnumerable{LocalSearchEngine.Core.Searching.VectorCandidate}
      description: Semantic hits in nearest-neighbour order.
    - id: keywordHits
      type: System.Collections.Generic.IEnumerable{LocalSearchEngine.Core.Searching.KeywordCandidate}
      description: BM25-scored keyword hits from the broad and phrase-rescue passes.
    - id: query
      type: System.String
      description: The query text after search operators have been removed.
    - id: settings
      type: LocalSearchEngine.Core.Searching.SearchSettings
      description: The search relevance settings.
    - id: titles
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: Optional dictionary map of page URLs to titles.
    - id: docKinds
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,LocalSearchEngine.Core.Crawling.Policies.DocKind}
      description: Optional dictionary map of page URLs to their <xref href="LocalSearchEngine.Core.Crawling.Policies.DocKind" data-throw-if-not-resolved="false"></xref>; URLs absent from it are treated as web pages.
    - id: authorities
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.Double}
      description: Optional dictionary map of page URLs to normalized internal PageRank.
    - id: inboundLinkHits
      type: System.Collections.Generic.IEnumerable{LocalSearchEngine.Core.Searching.InboundLinkCandidate}
      description: Optional inbound anchor/context candidates with field-weighted BM25 scores.
    return:
      type: System.Collections.Generic.List{LocalSearchEngine.Core.Searching.SearchResultItem}
      description: A sorted list of ranked search result items.
