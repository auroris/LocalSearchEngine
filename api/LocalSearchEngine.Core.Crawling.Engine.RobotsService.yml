  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Performs the HTTP fetch of robots.txt for the given base URI, recording host reachability and

    returning parse results or policy fallbacks.
  example: []
  syntax:
    content: private Task<(RobotsRules Rules, bool Unavailable)> GetRobotsRulesAsync(Uri baseUri, CrawlContext context, CancellationToken cancellationToken)
    parameters:
    - id: baseUri
      type: System.Uri
      description: The base URI/origin host to request robots.txt from.
    - id: context
      type: LocalSearchEngine.Core.Crawling.Engine.CrawlContext
      description: The active crawl context (supplies the size limit and host-health tracker).
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{LocalSearchEngine.Core.Crawling.Policies.RobotsRules,System.Boolean}}
      description: A tuple containing the parsed rules and whether robots.txt was unavailable (5xx error).
    content.vb: Private Function GetRobotsRulesAsync(baseUri As Uri, context As CrawlContext, cancellationToken As CancellationToken) As Task(Of (Rules As RobotsRules, Unavailable As Boolean))
