  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Reads the response stream up to <code class="paramref">maxBytes</code>, returning the bytes read and

    whether the stream still had data past the limit (i.e. the body was truncated).
  example: []
  syntax:
    content: public static Task<(byte[] Body, bool Truncated)> ReadLimitedAsync(HttpResponseMessage response, long maxBytes, CancellationToken cancellationToken)
    parameters:
    - id: response
      type: System.Net.Http.HttpResponseMessage
      description: The HTTP response whose content stream is read.
    - id: maxBytes
      type: System.Int64
      description: The maximum number of bytes to read.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{System.Byte[],System.Boolean}}
      description: A tuple of the bytes read and a flag indicating the body exceeded the limit.
    content.vb: Public Shared Function ReadLimitedAsync(response As HttpResponseMessage, maxBytes As Long, cancellationToken As CancellationToken) As Task(Of (Body As Byte(), Truncated As Boolean))
