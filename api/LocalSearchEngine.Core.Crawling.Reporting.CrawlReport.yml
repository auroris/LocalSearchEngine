  summary: >-
    The end-of-run summary returned by <code>CrawlerService.CrawlAsync</code>: the final statistics plus

    database totals, ready to be written to a stats file or printed as a summary.
  example: []
  syntax:
    content: public CrawlReport(string SeedUrl, DateTime StartedUtc, DateTime FinishedUtc, bool CompletedNaturally, bool Cancelled, CrawlStatsSnapshot Stats, long IndexedUrlsInDb, long CrawlStateRowsInDb, long ItemsAdded, long ItemsDeleted, IReadOnlyList<BrokenLink> BrokenLinks, IReadOnlyList<BrokenLink> RedirectedLinks, IReadOnlyList<string> UnreachableHosts)
    parameters:
    - id: SeedUrl
      type: System.String
      description: The URL the crawl started from.
    - id: StartedUtc
      type: System.DateTime
      description: When the crawl began.
    - id: FinishedUtc
      type: System.DateTime
      description: When the crawl finished.
    - id: CompletedNaturally
      type: System.Boolean
      description: Whether the crawl drained its frontier (vs. capped or cancelled).
    - id: Cancelled
      type: System.Boolean
      description: Whether cancellation was requested before the crawl finished.
    - id: Stats
      type: LocalSearchEngine.Core.Crawling.Reporting.CrawlStatsSnapshot
      description: The final running tallies.
    - id: IndexedUrlsInDb
      type: System.Int64
      description: Distinct indexed URLs in the database after the crawl.
    - id: CrawlStateRowsInDb
      type: System.Int64
      description: Crawl-state rows in the database after the crawl.
    - id: ItemsAdded
      type: System.Int64
      description: Net new indexed URLs this run (end total minus start total, plus deletions).
    - id: ItemsDeleted
      type: System.Int64
      description: Index entries removed this run (gone, banned, and stale).
    - id: BrokenLinks
      type: System.Collections.Generic.IReadOnlyList{LocalSearchEngine.Core.Crawling.Reporting.BrokenLink}
      description: 'Links the crawl found leading nowhere this run: a destination that returned an error (4xx/5xx) or could not be reached. Off-site links are included only when external link checking was enabled.'
    - id: RedirectedLinks
      type: System.Collections.Generic.IReadOnlyList{LocalSearchEngine.Core.Crawling.Reporting.BrokenLink}
      description: 'Links whose destination redirected this run: they still resolve, but the source page should be updated to point at the new location. Off-site links are included only when external link checking was enabled.'
    - id: UnreachableHosts
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: Hosts written off as unreachable this run (a connection-level failure with no prior response); their URLs were skipped.
