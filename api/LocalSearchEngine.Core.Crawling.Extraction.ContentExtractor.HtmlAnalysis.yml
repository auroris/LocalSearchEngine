    path: LocalSearchEngine.Core/Crawling/Extraction/ContentExtractor.cs
    startLine: 79
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Extraction
  summary: >-
    Gets or sets the RSS/Atom feeds the page advertises via

    <code>&lt;link rel="alternate" type="application/rss+xml|atom+xml"&gt;</code>. A site's own feed

    is its declared change journal — a positive signal of what to (re)fetch — so the crawl

    consults advertised feeds as extra seed material. Extracted regardless of nofollow (it is

    discovery metadata, like the canonical link, not an endorsement-carrying anchor).
  example: []
  syntax:
    content: public List<Uri> AdvertisedFeedUris
    return:
      type: System.Collections.Generic.List{System.Uri}
    content.vb: Public AdvertisedFeedUris As List(Of Uri)
