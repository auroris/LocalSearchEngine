  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Extraction
  summary: >-
    Decodes and parses an HTML body. A charset from the HTTP header is authoritative when

    present. Otherwise the document is parsed once (BOM-sniffed, defaulting to UTF-8) and,

    when the page itself declares a different encoding via <code>&lt;meta charset&gt;</code> or

    <code>&lt;meta http-equiv="Content-Type"&gt;</code>, re-parsed with that encoding —

    HtmlAgilityPack records the declaration as <xref href="HtmlAgilityPack.HtmlDocument.DeclaredEncoding" data-throw-if-not-resolved="false"></xref>

    but never re-decodes a stream on its own.
  example: []
  syntax:
    content: private static HtmlDocument LoadHtml(byte[] body, string? httpCharset)
    parameters:
    - id: body
      type: System.Byte[]
      description: The raw bytes of the HTML page.
    - id: httpCharset
      type: System.String
      description: The charset from the HTTP Content-Type header, if any.
    return:
      type: HtmlAgilityPack.HtmlDocument
      description: The parsed document.
    content.vb: Private Shared Function LoadHtml(body As Byte(), httpCharset As String) As HtmlDocument
  overload: LocalSearchEngine.Core.Crawling.Extraction.ContentExtractor.LoadHtml*
  nameWithType.vb: ContentExtractor.LoadHtml(Byte(), String)
