  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Finishes an extracted, indexable page: hashes the content that would be embedded and uses it to

    short-circuit needless work — a <xref href="LocalSearchEngine.Core.Crawling.Engine.TouchJob" data-throw-if-not-resolved="false"></xref> when this URL's stored content is unchanged,

    an <xref href="LocalSearchEngine.Core.Crawling.Engine.AliasJob" data-throw-if-not-resolved="false"></xref> when the same content is already indexed under another URL — otherwise an

    <xref href="LocalSearchEngine.Core.Crawling.Engine.IndexJob" data-throw-if-not-resolved="false"></xref> that (re)embeds it. Shared by the HTML, PDF, and DOCX paths.
  example: []
  syntax:
    content: private Task<CrawlJob> EmitIndexableAsync(string currentUrl, string finalUrl, string? redirectSourceUrl, int statusCode, (string? ETag, string? LastModified, string? ContentHash) finalState, string? title, string headings, string text, string? newETag, string? newLastModified, IReadOnlyCollection<string> outlinks, IReadOnlyCollection<string> offsiteLinks, DocKind kind, CancellationToken cancellationToken)
    parameters:
    - id: currentUrl
      type: System.String
      description: The requested URL.
    - id: finalUrl
      type: System.String
      description: The URL after redirects/normalization.
    - id: redirectSourceUrl
      type: System.String
      description: The dequeued URL when a redirect was followed; otherwise <code>null</code>.
    - id: statusCode
      type: System.Int32
      description: The HTTP status code of the response.
    - id: finalState
      type: System.ValueTuple{System.String,System.String,System.String}
      description: The crawl state previously recorded for <code class="paramref">finalUrl</code>.
    - id: title
      type: System.String
      description: The extracted document/page title.
    - id: headings
      type: System.String
      description: The extracted heading text.
    - id: text
      type: System.String
      description: The extracted main text.
    - id: newETag
      type: System.String
      description: The response ETag, if any.
    - id: newLastModified
      type: System.String
      description: The response Last-Modified header, if any.
    - id: outlinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: The in-scope outlinks discovered on the page.
    - id: offsiteLinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: The off-site links discovered on the page.
    - id: kind
      type: LocalSearchEngine.Core.Crawling.Policies.DocKind
      description: The classified document kind (Html/Pdf/Docx) of the page being indexed.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.Task{LocalSearchEngine.Core.Crawling.Engine.CrawlJob}
      description: The crawl job to persist for this page.
