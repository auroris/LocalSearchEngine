    startLine: 491
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Hashes the extracted, indexable fields of a page — what actually gets embedded — rather than the

    raw response bytes. The fields are domain-separated so that moving text between the title,

    headings, and body changes the hash. This is the basis for both the unchanged-page shortcut and

    cross-URL duplicate detection, so two responses index to the same hash exactly when they would

    produce the same index entry.
  example: []
  syntax:
    content: private static string ComputeContentHash(string? title, string headings, string text)
    parameters:
    - id: title
      type: System.String
      description: The extracted title, if any.
    - id: headings
      type: System.String
      description: The extracted heading text.
    - id: text
      type: System.String
      description: The extracted main text.
    return:
      type: System.String
      description: The uppercase hex SHA-256 of the combined fields.
    content.vb: Private Shared Function ComputeContentHash(title As String, headings As String, text As String) As String
  overload: LocalSearchEngine.Core.Crawling.Engine.CrawlProducer.ComputeContentHash*
