    startLine: 22
  assemblies:
  - LocalSearchEngine.Tests
  namespace: LocalSearchEngine.Tests
  summary: >-
    Drives feed-bounded incremental runs through <xref href="LocalSearchEngine.Core.Crawling.CrawlerService.CrawlSitesAsync(System.Collections.Generic.IReadOnlyList%7bSystem.String%7d%2cSystem.Boolean%2cSystem.String%2cSystem.Int32%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Int32%2cSystem.Int64%2cSystem.Boolean%2cLocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>. The

    contract under test is the positive-indicator rule: a site's advertised feed is its change

    journal, walked newest-first — entries not yet covered are the run, and the first entry whose

    stored visit is at or after its own date proves everything older was seen, so the run stops

    there. A feed that can't prove that (absent, unparseable, or its window ends before a covered

    entry) must fall back to a full crawl, never to guessing.
