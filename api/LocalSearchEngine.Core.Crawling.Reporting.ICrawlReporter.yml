    id: ICrawlReporter
    path: LocalSearchEngine.Core/Crawling/Reporting/ICrawlReporter.cs
    startLine: 9
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Reporting
  summary: >-
    Receives crawl progress so a host (CLI, web, tests) can present it however it likes. The crawler

    invokes these as work happens; they must be cheap and must never throw, as the crawl does not guard

    against a misbehaving reporter. <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter.PhaseChanged(LocalSearchEngine.Core.Crawling.Reporting.CrawlPhase%2cLocalSearchEngine.Core.Crawling.Reporting.CrawlStatsSnapshot)" data-throw-if-not-resolved="false"></xref> and <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter.PageProcessed(System.String%2cLocalSearchEngine.Core.Crawling.Reporting.CrawlOutcome%2cLocalSearchEngine.Core.Crawling.Reporting.CrawlStatsSnapshot)" data-throw-if-not-resolved="false"></xref> arrive on

    the crawler thread, but <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter.EmbedProgress(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> arrives on the separate embedder thread and can

    overlap them — so an implementation that keeps shared display state must guard it.
  example: []
  syntax:
    content: public interface ICrawlReporter
    content.vb: Public Interface ICrawlReporter
  derivedClasses:
  - LocalSearchEngine.Core.Crawling.Reporting.NullCrawlReporter
  - LocalSearchEngine.Crawler.PlainCrawlReporter
  - LocalSearchEngine.Crawler.SpectreCrawlReporter
  - LocalSearchEngine.Tests.CrawlerServiceIntegrationTests.RecordingReporter
