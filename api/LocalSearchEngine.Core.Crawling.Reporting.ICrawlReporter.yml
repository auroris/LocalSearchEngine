    id: EmbedProgress
    path: LocalSearchEngine.Core/Crawling/Reporting/ICrawlReporter.cs
    startLine: 28
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Reporting
  summary: >-
    The embedder finished an item. Called from the embedder thread, including while the crawler is

    idle and the queued backlog drains, so the embedding bar keeps moving after the crawl itself ends.
  example: []
  syntax:
    content: void EmbedProgress(int processed, int queued)
    parameters:
    - id: processed
      type: System.Int32
      description: Items the embedder has finished so far.
    - id: queued
      type: System.Int32
      description: Items queued for embedding so far (the bar's denominator; still growing mid-crawl).
    content.vb: Sub EmbedProgress(processed As Integer, queued As Integer)
  overload: LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter.EmbedProgress*
