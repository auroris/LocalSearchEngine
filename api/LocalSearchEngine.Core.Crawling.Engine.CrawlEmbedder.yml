  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Runs the embedder loop until the queue is completed and fully drained, applying each item's chunk

    writes. Reads with <xref href="System.Threading.Channels.ChannelReader%601.TryRead(%600%40)" data-throw-if-not-resolved="false"></xref> so the lane can be marked idle while parked

    on an empty queue rather than leaving the last job's mark to look like a stall.
  example: []
  syntax:
    content: public Task ConsumeAsync()
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function ConsumeAsync() As Task
