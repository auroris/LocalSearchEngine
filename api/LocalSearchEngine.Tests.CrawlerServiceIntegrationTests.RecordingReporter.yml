  summary: >-
    The embedder finished an item. Called from the embedder thread, including while the crawler is

    idle and the queued backlog drains, so the embedding bar keeps moving after the crawl itself ends.
  example: []
  syntax:
    content: public void EmbedProgress(int processed, int queued)
    parameters:
    - id: processed
      type: System.Int32
      description: Items the embedder has finished so far.
    - id: queued
      type: System.Int32
      description: Items queued for embedding so far (the bar's denominator; still growing mid-crawl).
