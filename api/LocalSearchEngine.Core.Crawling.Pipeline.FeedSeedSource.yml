  summary: >-
    Seeds an update crawl with a single <xref href="LocalSearchEngine.Core.Crawling.Pipeline.FeedDocument" data-throw-if-not-resolved="false"></xref>. Composed with

    <code>FollowLinks = false</code> and pruning off, this is the whole entry surface of a feed-driven run:

    the feed names what changed; nothing else on the site is fetched, re-indexed, or deleted.
