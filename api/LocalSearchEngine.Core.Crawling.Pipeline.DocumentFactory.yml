  summary: >-
    Resolves an unknown <xref href="LocalSearchEngine.Core.Crawling.Pipeline.PageDocument" data-throw-if-not-resolved="false"></xref> into the typed document that can process its body,

    after the single fetch. Placed here rather than in a constructor because an object cannot decide

    mid-construction to be a different type — resolution has to be a function that returns the right

    one. Classification defers to <xref href="LocalSearchEngine.Core.Crawling.Policies.CrawlPolicy.ClassifyContent(System.String%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref>: the Content-Type header

    wins, magic bytes are the fallback for misdeclared servers.
