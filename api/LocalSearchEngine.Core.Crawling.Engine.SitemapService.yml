  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Seeds the frontier from a site's XML sitemaps. Starting from the origin's <code>/sitemap.xml</code> plus

    any sitemaps declared in robots.txt, it fetches each (under the crawl's size cap), parses the

    <code>&lt;loc&gt;</code> entries, and follows sitemap-index files into their children — bounded by a

    safety limit so a cycle can't run away. Entries are normalized and kept only if they sit on the

    same origin and robots.txt allows them, then handed to <xref href="LocalSearchEngine.Core.Crawling.Engine.CrawlContext.Discover(System.String)" data-throw-if-not-resolved="false"></xref> to join

    the queue. XML is parsed with DTD processing and external resolution disabled, so a hostile sitemap

    can't trigger entity expansion or out-of-band fetches.
  example: []
  syntax:
    content: internal sealed class SitemapService
    content.vb: Friend NotInheritable Class SitemapService
