- uid: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover(System.Uri)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover(System.Uri)
  id: Discover(System.Uri)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext
  langs:
  - csharp
  - vb
  name: Discover(Uri)
  nameWithType: ICrawlContext.Discover(Uri)
  fullName: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover(System.Uri)
  type: Method
  source:
    remote:
      path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: Discover
    path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
    startLine: 44
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Offers a link discovered on a page (or stored from a previous visit) to the frontier.

    A no-op returning <code>false</code> when <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.FollowLinks" data-throw-if-not-resolved="false"></xref> is off — this is the one

    switch that keeps a feed run from turning into a crawl.
  example: []
  syntax:
    content: bool Discover(Uri fetchUri)
    parameters:
    - id: fetchUri
      type: System.Uri
      description: The exact resolved link target.
    return:
      type: System.Boolean
      description: <code>true</code> if the link was new, in scope, and enqueued.
    content.vb: Function Discover(fetchUri As Uri) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover*
- uid: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.DiscoverFeed(System.Uri)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.DiscoverFeed(System.Uri)
  id: DiscoverFeed(System.Uri)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext
  langs:
  - csharp
  - vb
  name: DiscoverFeed(Uri)
  nameWithType: ICrawlContext.DiscoverFeed(Uri)
  fullName: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.DiscoverFeed(System.Uri)
  type: Method
  source:
    remote:
      path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: DiscoverFeed
    path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
    startLine: 56
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Offers a feed a page advertises to the frontier as extra seed material — a positive signal

    only: whatever the feed lists is guaranteed into the frontier, but a URL's absence from a

    feed never suppresses anything (feeds are windows onto the newest items, so absence proves

    nothing). Gated like link expansion (<xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.FollowLinks" data-throw-if-not-resolved="false"></xref>) and by a small per-run

    budget, because platforms advertise a per-post comments feed on every post and an unbounded

    crawl of those buys nothing.
  example: []
  syntax:
    content: bool DiscoverFeed(Uri feedUri)
    parameters:
    - id: feedUri
      type: System.Uri
      description: The exact resolved feed target.
    return:
      type: System.Boolean
      description: <code>true</code> if the feed was new, in scope, within budget, and enqueued.
    content.vb: Function DiscoverFeed(feedUri As Uri) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.DiscoverFeed*
- uid: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  id: Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext
  langs:
  - csharp
  - vb
  name: Enqueue(Document)
  nameWithType: ICrawlContext.Enqueue(Document)
  fullName: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  type: Method
  source:
    remote:
      path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: Enqueue
    path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
    startLine: 68
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    The single frontier choke point: scope check first (a URL rejected before a seed redirect

    widens scope must not burn its dedup key), then the atomic seen-claim, then the pending-work

    increment, then the channel write. Never gated by <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.FollowLinks" data-throw-if-not-resolved="false"></xref> — seed material

    and identity enqueues (redirect target, canonical alias, duplicate original) always pass

    through. Only valid while the caller holds pending work (seeding or processing a document);

    that invariant is what makes the write-after-complete race impossible.
  example: []
  syntax:
    content: bool Enqueue(Document document)
    parameters:
    - id: document
      type: LocalSearchEngine.Core.Crawling.Pipeline.Document
      description: The work item to enqueue.
    return:
      type: System.Boolean
      description: <code>true</code> if accepted; <code>false</code> if out of scope or already seen.
    content.vb: Function Enqueue(document As Document) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue*
