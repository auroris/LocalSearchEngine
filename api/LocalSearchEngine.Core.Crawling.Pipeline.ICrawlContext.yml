- uid: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex(System.String,System.String,System.String@)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex(System.String,System.String,System.String@)
  id: TryAcceptIndex(System.String,System.String,System.String@)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext
  langs:
  - csharp
  - vb
  name: TryAcceptIndex(string, string, out string?)
  nameWithType: ICrawlContext.TryAcceptIndex(string, string, out string?)
  fullName: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex(string, string, out string?)
  type: Method
  source:
    remote:
      path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: TryAcceptIndex
    path: LocalSearchEngine.Core/Crawling/Pipeline/ICrawlContext.cs
    startLine: 88
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Atomically resolves same-run duplicate ownership and reserves one global index slot. Two

    workers indexing identical content at once resolve to one accepted index entry and one

    alias; distinct pages cannot exceed the run's global page cap.
  example: []
  syntax:
    content: bool TryAcceptIndex(string contentHash, string url, out string? duplicateOf)
    parameters:
    - id: contentHash
      type: System.String
      description: The extracted-content hash.
    - id: url
      type: System.String
      description: The URL claiming it.
    - id: duplicateOf
      type: System.String
      description: >-
        Receives the accepted owner when this is a same-run duplicate;
            otherwise <code>null</code>, including when the cap rejected the candidate.
    return:
      type: System.Boolean
      description: <code>true</code> if the URL owns a reserved index slot; otherwise, <code>false</code>.
    content.vb: Function TryAcceptIndex(contentHash As String, url As String, duplicateOf As String) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex*
  nameWithType.vb: ICrawlContext.TryAcceptIndex(String, String, String)
  fullName.vb: LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex(String, String, String)
  name.vb: TryAcceptIndex(String, String, String)
