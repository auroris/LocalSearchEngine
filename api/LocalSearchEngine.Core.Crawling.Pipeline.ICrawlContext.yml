  summary: >-
    Sends a finished page's classification to the persistence consumer and updates the job and

    embedding-backlog tallies. Index jobs must first reserve a slot through

    <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.TryAcceptIndex(System.String%2cSystem.String%2cSystem.String%40)" data-throw-if-not-resolved="false"></xref>.
  example: []
