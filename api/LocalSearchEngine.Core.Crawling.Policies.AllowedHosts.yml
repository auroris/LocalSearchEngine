  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    The set of hosts a crawl may touch. Each rule is a hostname with an optional scheme and

    port restriction; a component that is not specified matches anything. This is purely a

    filter — listing a host here never causes it to be contacted. Robots.txt and pages are

    only fetched for origins the crawl actually reaches.

    Safe for concurrent readers while rules are added: the rule set grows mid-crawl when the

    seed redirects to a new origin, so mutation swaps in a fresh array (copy-on-write) rather

    than appending to a list a concurrent <xref href="LocalSearchEngine.Core.Crawling.Policies.AllowedHosts.IsAllowed(System.Uri)" data-throw-if-not-resolved="false"></xref> may be walking.
  example: []
  syntax:
    content: public sealed class AllowedHosts
    content.vb: Public NotInheritable Class AllowedHosts
