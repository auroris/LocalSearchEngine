  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    Parses and adds a configured entry of the form <code>[scheme://]host[:port]</code>.

    An omitted scheme matches any scheme; an omitted port matches any port. The

    "www." variant of a host is NOT implied — list it as its own entry to crawl both.
  example: []
  syntax:
    content: public bool Add(string? entry)
    parameters:
    - id: entry
      type: System.String
      description: The entry to parse, e.g. "example.com", "https://example.com", or "example.com:8080".
    return:
      type: System.Boolean
      description: <code>true</code> if the entry was understood and added; otherwise, <code>false</code>.
    content.vb: Public Function Add(entry As String) As Boolean
