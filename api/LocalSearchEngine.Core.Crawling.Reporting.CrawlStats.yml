  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Reporting
  summary: >-
    Captures an immutable snapshot, stamped with the moment's phase, discovered-URL count, and

    elapsed time (which the stats object does not track itself).
  example: []
  syntax:
    content: public CrawlStatsSnapshot Snapshot(CrawlPhase phase, int discovered, TimeSpan elapsed)
    parameters:
    - id: phase
      type: LocalSearchEngine.Core.Crawling.Reporting.CrawlPhase
      description: The current crawl phase.
    - id: discovered
      type: System.Int32
      description: The number of unique URLs discovered so far.
    - id: elapsed
      type: System.TimeSpan
