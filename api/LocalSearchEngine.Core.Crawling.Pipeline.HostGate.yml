  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Resolves the politeness gap for a host: its robots.txt crawl-delay capped at

    <xref href="LocalSearchEngine.Core.Crawling.Pipeline.HostGate.MaxCrawlDelaySeconds" data-throw-if-not-resolved="false"></xref>, or the configured default when none is declared.
  example: []
  syntax:
    content: public static TimeSpan ResolveDelay(RobotsRules robots, int defaultRequestDelayMs)
    parameters:
    - id: robots
      type: LocalSearchEngine.Core.Crawling.Policies.RobotsRules
      description: The host's robots.txt rules.
    - id: defaultRequestDelayMs
      type: System.Int32
      description: The gap to use when robots.txt declares no crawl-delay.
    return:
      type: System.TimeSpan
      description: The minimum time between fetch starts on the host.
