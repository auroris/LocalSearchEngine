  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    Claims the next polite moment to contact <code class="paramref">host</code> and waits until it arrives —

    which is right now whenever the host was last bothered at least <code class="paramref">minGap</code> ago.

    Gaps are measured start-to-start. A cancelled wait leaves its claim spent, which errs on the

    polite side.
  example: []
  syntax:
    content: public ValueTask WaitTurnAsync(string host, TimeSpan minGap, CancellationToken ct = default)
    parameters:
    - id: host
      type: System.String
      description: The host about to be contacted.
    - id: minGap
      type: System.TimeSpan
      description: The minimum time between request starts on this host.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancels the wait.
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Public Function WaitTurnAsync(host As String, minGap As TimeSpan, ct As CancellationToken = Nothing) As ValueTask
