  namespace: LocalSearchEngine.Core.Crawling.Extraction
  summary: >-
    A text-extraction strategy that returns the same text as <xref href="iText.Kernel.Pdf.Canvas.Parser.Listener.SimpleTextExtractionStrategy" data-throw-if-not-resolved="false"></xref>

    (to which it delegates) while also counting, per drawn glyph, whether the glyph's font can be

    reversed to Unicode. That ratio is what tells a readable PDF apart from one that extracts as

    garbage because its fonts lack the mapping iText needs.
  example: []
  syntax:
    content: 'private sealed class ContentExtractor.TextQualityExtractionStrategy : ITextExtractionStrategy, IEventListener'
