    path: LocalSearchEngine.Core/Crawling/Extraction/ContentExtractor.cs
    startLine: 538
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Extraction
  summary: >-
    Decides whether text drawn with <code class="paramref">font</code> can be recovered as Unicode. A

    ToUnicode CMap is the authoritative answer when present. Without one, only simple fonts

    (Type1/TrueType) still reverse reliably through their glyph-name encoding; composite (Type0)

    and Type3 fonts then expose only glyph IDs or private encodings — the garbage case.
  example: []
  syntax:
    content: private static bool IsFontUnicodeMappable(PdfFont font)
    parameters:
    - id: font
      type: iText.Kernel.Font.PdfFont
    return:
      type: System.Boolean
    content.vb: Private Shared Function IsFontUnicodeMappable(font As PdfFont) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Extraction.ContentExtractor.TextQualityExtractionStrategy.IsFontUnicodeMappable*
