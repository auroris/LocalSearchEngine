      description: The worker's crawl context.
    - id: title
      type: System.String
      description: The extracted title.
    - id: headings
      type: System.String
      description: The extracted heading text.
    - id: text
      type: System.String
      description: The extracted main text.
    - id: outlinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: The in-scope outlinks (normalized), for the link rows.
    - id: offsiteLinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: The off-site links, for optional verification.
    - id: kind
      type: LocalSearchEngine.Core.Crawling.Policies.DocKind
      description: The classified document kind.
    - id: linkEvidence
      type: System.Collections.Generic.IReadOnlyCollection{LocalSearchEngine.Core.Crawling.LinkEvidence}
      description: Anchor and nearby text describing HTML outlinks; empty for non-HTML documents.
    return:
      type: System.Threading.Tasks.Task
