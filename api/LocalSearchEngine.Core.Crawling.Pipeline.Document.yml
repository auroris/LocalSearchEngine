  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Finishes an extracted, indexable document — the shared tail of the HTML, PDF, and DOCX paths.

    Hashes what would be embedded and uses it to short-circuit the expensive step: a

    <xref href="LocalSearchEngine.Core.Crawling.Engine.TouchJob" data-throw-if-not-resolved="false"></xref> when this URL's stored content is unchanged (and its chunks actually

    exist — a row without chunks is a torn state that must self-heal by re-embedding), an

    <xref href="LocalSearchEngine.Core.Crawling.Engine.AliasJob" data-throw-if-not-resolved="false"></xref> when the same content is already indexed under another URL, otherwise

    an <xref href="LocalSearchEngine.Core.Crawling.Engine.IndexJob" data-throw-if-not-resolved="false"></xref> that (re-)embeds.
  example: []
  syntax:
