    startLine: 29
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    One unit of crawl work flowing through the crawl channel, and the polymorphic behavior for the

    content behind it. A document carries two forms of its URL on purpose: <xref href="LocalSearchEngine.Core.Crawling.Pipeline.Document.FetchUri" data-throw-if-not-resolved="false"></xref> is

    the exact resolved target and is what goes on the wire (re-parsing a normalized string re-encodes

    percent-escapes, which is how encoded filesystem paths used to 404), while <xref href="LocalSearchEngine.Core.Crawling.Pipeline.Document.DedupKey" data-throw-if-not-resolved="false"></xref>

    is the normalized display form that is the URL's identity everywhere else — the visited set, the

    database rows, robots matching. Keeping the stored form identical to the old engine's means an

    existing database keeps deduplicating, 304-validating, and pruning with no migration.


    Construction is trivial and side-effect free — no I/O, no dedup checks, no channel writes; a

    constructor can't be async, can't say "never mind", and can't re-type itself, so all of that

    lives in the worker and in <xref href="LocalSearchEngine.Core.Crawling.Pipeline.Document.ProcessAsync(LocalSearchEngine.Core.Crawling.Pipeline.FetchResult%2cLocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>. Contract for implementations: any child

    work must be enqueued (via <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover(System.Uri)" data-throw-if-not-resolved="false"></xref>/<xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)" data-throw-if-not-resolved="false"></xref>)

    before ProcessAsync returns — the completion refcount treats the document's own pending token as

    covering its children's enqueues, and a late enqueue would race crawl termination.
