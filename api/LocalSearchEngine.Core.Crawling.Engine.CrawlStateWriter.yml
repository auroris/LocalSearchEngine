    path: LocalSearchEngine.Core/Crawling/Engine/CrawlStateWriter.cs
    startLine: 18
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Applies the crawl-state half of a finished <xref href="LocalSearchEngine.Core.Crawling.Engine.CrawlJob" data-throw-if-not-resolved="false"></xref> — the CrawlState row, the LinkIndex

    rows, and the destination link-status stamp — as one atomic transaction on the crawl's single write

    connection. This is the crawler thread's only writer; the page's chunk writes are handed to the

    <xref href="LocalSearchEngine.Core.Crawling.Engine.CrawlEmbedder" data-throw-if-not-resolved="false"></xref> instead, which is what lets the crawl finish without waiting on embedding.

    Every write takes the shared <xref href="LocalSearchEngine.Core.Crawling.Engine.DbWriteGate" data-throw-if-not-resolved="false"></xref> so it never overlaps the embedder's chunk writes

    (SQLite allows a single writer at a time). Each job is wrapped in its own try/catch so one bad page

    can't halt the crawl.
  example: []
  syntax:
    content: internal sealed class CrawlStateWriter
    content.vb: Friend NotInheritable Class CrawlStateWriter
