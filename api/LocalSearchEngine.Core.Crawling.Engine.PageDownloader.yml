  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: Executes a request, validating redirects, content sizes, and mime-types.
  example: []
  syntax:
    content: public Task<DownloadResult> DownloadAsync(Uri requestUri, string normalizedUrl, string? etag, string? lastModified, long maxBytes, bool acceptAnyContentType = false)
    parameters:
    - id: requestUri
      type: System.Uri
      description: >-
        The exact URI to put on the wire. Kept as a <xref href="System.Uri" data-throw-if-not-resolved="false"></xref> so the
            href's original escaping survives — re-parsing a display-form string re-encodes it, which is
            how percent-encoded filesystem paths used to break.
    - id: normalizedUrl
      type: System.String
      description: >-
        The URL's normalized identity, compared against the (normalized)
            final request URI to detect that the request moved.
    - id: etag
      type: System.String
      description: The cached ETag, if any, for conditional request validation.
    - id: lastModified
      type: System.String
      description: The cached Last-Modified string, if any, for conditional request validation.
    - id: maxBytes
      type: System.Int64
      description: The maximum allowed download size in bytes.
    - id: acceptAnyContentType
      type: System.Boolean
      description: >-
        Skips the content-type whitelist and signature sniff.
            Infrastructure fetches (sitemaps, feeds) are XML the page whitelist would reject; their
            parsers are the validation.
    return:
      type: System.Threading.Tasks.Task{LocalSearchEngine.Core.Crawling.Engine.DownloadResult}
      description: A <xref href="LocalSearchEngine.Core.Crawling.Engine.DownloadResult" data-throw-if-not-resolved="false"></xref> object summarizing the download status and metadata.
    content.vb: Public Function DownloadAsync(requestUri As Uri, normalizedUrl As String, etag As String, lastModified As String, maxBytes As Long, acceptAnyContentType As Boolean = False) As Task(Of DownloadResult)
