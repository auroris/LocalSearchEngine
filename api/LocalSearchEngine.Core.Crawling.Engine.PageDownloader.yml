    parameters:
    - id: response
      type: System.Net.Http.HttpResponseMessage
      description: The HTTP response message containing the stream.
    - id: maxBytes
      type: System.Int64
      description: The maximum allowed bytes to read.
    - id: prefixCheck
      type: System.Nullable{LocalSearchEngine.Core.Crawling.Engine.PageDownloader.PrefixCheck}
      description: The signature check to run, or <code>null</code> to accept any body.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{System.Byte[],System.Boolean}}
