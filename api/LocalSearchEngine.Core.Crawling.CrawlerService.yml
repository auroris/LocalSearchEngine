    flight past <xref href="LocalSearchEngine.Core.Crawling.CrawlerService.StallThreshold" data-throw-if-not-resolved="false"></xref>, naming the URL or phase that is stuck. The loop ends

    when <code class="paramref">timer</code> is disposed.
