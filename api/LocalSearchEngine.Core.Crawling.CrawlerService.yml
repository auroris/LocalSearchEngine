      description: The maximum number of pages to index.
    - id: allowedServers
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional additional allowed hosts.
    - id: noIndexPatterns
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional URL glob patterns whose pages are followed for links but never indexed ("noindex, follow").
    - id: maxPagesPerHost
