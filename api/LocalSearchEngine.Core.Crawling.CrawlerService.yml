    - id: allowedServers
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional additional allowed hosts (item links outside scope are skipped).
    - id: noIndexPatterns
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional URL glob patterns whose pages are fetched but never indexed.
    - id: maxCrawlSizeBytes
      type: System.Int64
      description: The maximum size in bytes allowed for a fetched page/file.
    - id: reporter
      type: LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter
      description: Receives live progress and phase changes.
    - id: requestDelayMs
      type: System.Int32
      description: The politeness gap between same-host fetches.
    - id: crawlWorkers
      type: System.Int32
      description: The number of concurrent crawl workers.
    return:
      type: System.Threading.Tasks.Task{LocalSearchEngine.Core.Crawling.Reporting.CrawlReport}
      description: A <xref href="LocalSearchEngine.Core.Crawling.Reporting.CrawlReport" data-throw-if-not-resolved="false"></xref> summarizing what the update run indexed and touched.
