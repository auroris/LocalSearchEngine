  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling
  summary: >-
    Runs an update crawl driven by an RSS/Atom feed: the feed is trusted as the site's change

    journal, so only the items it lists are fetched (with conditional requests — unchanged items

    answer 304, and only a changed content hash re-embeds). Links are not followed, nothing is

    pruned, and the link-verification pass is skipped: the run touches exactly what the feed

    names and deletes nothing it didn't visit. Deletions on the site are reconciled by the next

    full <xref href="LocalSearchEngine.Core.Crawling.CrawlerService.CrawlAsync(System.String%2cSystem.Int32%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Int32%2cSystem.Int64%2cSystem.Boolean%2cLocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Task<CrawlReport> CrawlFeedAsync(string feedUrl, int maxPages = 2147483647, IEnumerable<string>? allowedServers = null, IEnumerable<string>? noIndexPatterns = null, long maxCrawlSizeBytes = 15728640, ICrawlReporter? reporter = null, int requestDelayMs = 250, int crawlWorkers = 4)
    parameters:
    - id: feedUrl
      type: System.String
      description: The rss.xml / Atom feed URL.
    - id: maxPages
