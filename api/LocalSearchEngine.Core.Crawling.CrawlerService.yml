  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling
  summary: >-
    Polls the heartbeat on a timer and logs a warning per lane whose current activity has been in

    flight past <xref href="LocalSearchEngine.Core.Crawling.CrawlerService.StallThreshold" data-throw-if-not-resolved="false"></xref>, naming the URL or phase that is stuck. Quiet lanes —

    parked idle or queued at a politeness gate — are expected to sit and are never warned about.

    The loop ends when <code class="paramref">timer</code> is disposed.
