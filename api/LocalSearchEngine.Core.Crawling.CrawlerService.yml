    id: WarnIfStalled
    path: LocalSearchEngine.Core/Crawling/CrawlerService.cs
    startLine: 316
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling
  summary: >-
    Logs a possible-stall warning for one heartbeat lane, naming which half of the pipeline is stuck so

    the log points at the real culprit instead of whichever thread happened to mark last. An idle lane

    (its thread parked with no work) is never a stall, so it is skipped.
  example: []
  syntax:
    content: private void WarnIfStalled(string lane, (string Activity, TimeSpan Elapsed) state)
    parameters:
    - id: lane
      type: System.String
      description: The lane label, "crawler" or "embedder".
