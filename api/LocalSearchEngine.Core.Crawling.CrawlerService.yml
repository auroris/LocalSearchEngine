    id: CrawlSitesAsync
    path: LocalSearchEngine.Core/Crawling/CrawlerService.cs
    startLine: 124
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling
  summary: >-
    Crawls one or more configured sites in a single run — the no-argument CLI path, seeded from

    every allowed origin at once so post-crawl pruning sees the whole in-scope world in one pass.

    With <code class="paramref">allowIncremental</code>, each site's advertised feed is consulted first as a

    positive indicator: walking it newest-first, entries not yet covered are the changes, and the

    first already-covered entry (stored visit at or after the entry's date) proves everything

    older was seen — so the run crawls exactly those changes and stops. If any site can't prove

    its change list complete (no feed, or the feed's window ends before a covered entry), the

    run falls back to a normal full crawl of every site.
  example: []
  syntax:
    content: public Task<CrawlReport> CrawlSitesAsync(IReadOnlyList<string> seedUrls, bool allowIncremental = false, string? incrementalFeed = null, int maxPages = 2147483647, IEnumerable<string>? allowedServers = null, IEnumerable<string>? noIndexPatterns = null, int maxPagesPerHost = 2147483647, long maxCrawlSizeBytes = 15728640, bool checkExternalLinks = false, ICrawlReporter? reporter = null, int requestDelayMs = 250, int crawlWorkers = 4)
    parameters:
    - id: seedUrls
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: The site root URLs to crawl.
    - id: allowIncremental
      type: System.Boolean
      description: Whether feeds may bound the run to just the listed changes.
    - id: incrementalFeed
      type: System.String
      description: >-
        A declared change-journal feed covering every seed host at
            once; when set, it replaces per-site autodiscovery as the incremental proof. The site set's
            one feed-capable host can vouch for hosts (like a bare document server) that cannot
            advertise a feed of their own.
    - id: maxPages
      type: System.Int32
      description: The maximum number of pages to index.
    - id: allowedServers
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional additional allowed hosts.
    - id: noIndexPatterns
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Optional URL glob patterns whose pages are followed for links but never indexed.
    - id: maxPagesPerHost
      type: System.Int32
      description: The maximum pages to crawl on any single host.
    - id: maxCrawlSizeBytes
      type: System.Int64
      description: The maximum size in bytes allowed for a crawled page/file.
    - id: checkExternalLinks
      type: System.Boolean
      description: Whether to check external links after a full crawl.
    - id: reporter
      type: LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter
      description: Receives live progress and phase changes.
    - id: requestDelayMs
      type: System.Int32
      description: The politeness gap between same-host fetches.
    - id: crawlWorkers
      type: System.Int32
      description: The number of concurrent crawl workers.
    return:
      type: System.Threading.Tasks.Task{LocalSearchEngine.Core.Crawling.Reporting.CrawlReport}
      description: A <xref href="LocalSearchEngine.Core.Crawling.Reporting.CrawlReport" data-throw-if-not-resolved="false"></xref> summarizing the run.
    content.vb: Public Function CrawlSitesAsync(seedUrls As IReadOnlyList(Of String), allowIncremental As Boolean = False, incrementalFeed As String = Nothing, maxPages As Integer = 2147483647, allowedServers As IEnumerable(Of String) = Nothing, noIndexPatterns As IEnumerable(Of String) = Nothing, maxPagesPerHost As Integer = 2147483647, maxCrawlSizeBytes As Long = 15728640, checkExternalLinks As Boolean = False, reporter As ICrawlReporter = Nothing, requestDelayMs As Integer = 250, crawlWorkers As Integer = 4) As Task(Of CrawlReport)
