    parameters:
    - id: heartbeat
      type: LocalSearchEngine.Core.Crawling.Reporting.CrawlHeartbeat
      description: The shared activity marker every crawl actor bumps.
    - id: timer
      type: System.Threading.PeriodicTimer
      description: The periodic timer driving the poll; disposing it stops the loop.
    return:
      type: System.Threading.Tasks.Task
      description: A <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> that completes when the timer is disposed.
