      description: The target page URL.
    - id: StatusCode
      type: System.Int32
      description: The response HTTP status code.
    - id: Title
      type: System.String
      description: The document/page title.
    - id: ETag
      type: System.String
      description: The HTTP response ETag.
    - id: LastModified
      type: System.String
      description: The HTTP response Last-Modified header value.
    - id: ContentHash
      type: System.String
      description: The SHA256 hash of the extracted indexable content, or <code>null</code> when the page was not parsed for indexing.
    - id: Outlinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: List of extracted in-scope outlinks.
    - id: OffsiteLinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: List of extracted out-of-scope/offsite links.
    - id: DocKind
      type: LocalSearchEngine.Core.Crawling.Policies.DocKind
      description: The classified document kind (Html/Pdf/Docx) of the page, recorded even though its content is not indexed.
    - id: RedirectSourceUrl
      type: System.String
      description: The source URL if reached via a redirect.
