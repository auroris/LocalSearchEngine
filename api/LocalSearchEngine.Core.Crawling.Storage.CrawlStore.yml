  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Storage
  summary: >-
    The crawler's SQL layer: one static home for every query and command it issues against SQLite,

    keeping raw SQL out of the engine. It owns the schema it depends on — the <code>CrawlState</code> table

    (per-URL status, cache validators, title, content hash, and link authority), the <code>LinkIndex</code>

    graph, compact inbound-link context, and the FTS5 mirrors of body and link text with the triggers

    that keep them in sync — created by <xref href="LocalSearchEngine.Core.Crawling.Storage.CrawlStore.EnsureSchemaAsync(System.String)" data-throw-if-not-resolved="false"></xref> after the vector store has made

    its <code>text_chunks</code> table. The rest are focused reads and writes over those tables: record a

    visit, store or re-derive a page's links, find a duplicate by content hash, list URLs a crawl no

    longer reaches, and so on. Every method works on a connection the caller owns and opens; the write

    methods accept an optional <xref href="Microsoft.Data.Sqlite.SqliteTransaction" data-throw-if-not-resolved="false"></xref> so a caller can batch several of them

    into one atomic unit (the consumer applies each page's writes that way).
  example: []
