  namespace: LocalSearchEngine.Core.Crawling.Storage
  summary: >-
    Recomputes query-independent authority over the indexed internal-link graph using PageRank.

    Only URLs with stored text chunks are graph nodes, and only internal edges whose source and

    target are both nodes vote. Raw PageRank and a log-normalized [0,1] feature are persisted on

    <code>CrawlState</code> in one transaction.
  example: []
  syntax:
    content: public static Task<(int NodeCount, int EdgeCount, int Iterations)> RecomputePageRankAsync(SqliteConnection connection, double damping = 0.85, int maximumIterations = 100, double tolerance = 1E-08)
    parameters:
    - id: connection
      type: Microsoft.Data.Sqlite.SqliteConnection
      description: The open writable database connection.
    - id: damping
      type: System.Double
      description: The probability of following a graph edge rather than teleporting.
    - id: maximumIterations
      type: System.Int32
      description: The iteration ceiling for convergence.
    - id: tolerance
      type: System.Double
      description: The L1 score-delta convergence threshold.
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{System.Int32,System.Int32,System.Int32}}
      description: Counts of graph nodes, retained edges, and iterations performed.
    content.vb: Public Shared Function RecomputePageRankAsync(connection As SqliteConnection, damping As Double = 0.85, maximumIterations As Integer = 100, tolerance As Double = 1E-08) As Task(Of (NodeCount As Integer, EdgeCount As Integer, Iterations As Integer))
