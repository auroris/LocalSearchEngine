  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Storage
  summary: >-
    Stores every link discovered on a page — in-scope outlinks and off-site links alike —

    replacing any existing links for that page in a transaction. New rows start

    <xref href="LocalSearchEngine.Core.Crawling.Reporting.LinkStatus.Unknown" data-throw-if-not-resolved="false"></xref> with no <code>LastUpdated</code>; their status is

    filled in when the destination is visited this run, or by the end-of-crawl verification pass.
  example: []
  syntax:
    content: public static Task StoreLinksAsync(SqliteConnection connection, string fromUrl, IReadOnlyCollection<string> inScopeLinks, IReadOnlyCollection<string> offsiteLinks, CancellationToken cancellationToken)
    parameters:
    - id: connection
      type: Microsoft.Data.Sqlite.SqliteConnection
      description: The open database connection.
    - id: fromUrl
      type: System.String
      description: The source page URL.
    - id: inScopeLinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: Target URLs within the crawl scope (stored with <code>External=0</code>).
    - id: offsiteLinks
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
      description: Off-site target URLs (stored with <code>External=1</code>).
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.Task
      description: A <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> representing the asynchronous operation.
    content.vb: Public Shared Function StoreLinksAsync(connection As SqliteConnection, fromUrl As String, inScopeLinks As IReadOnlyCollection(Of String), offsiteLinks As IReadOnlyCollection(Of String), cancellationToken As CancellationToken) As Task
