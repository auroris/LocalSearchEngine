    path: LocalSearchEngine.Core/Crawling/Engine/EmbeddingBacklog.cs
    startLine: 12
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    The embedder's running counts, shared across the two threads: the crawler bumps <xref href="LocalSearchEngine.Core.Crawling.Engine.EmbeddingBacklog.Queued" data-throw-if-not-resolved="false"></xref>

    as it drops chunk work on the queue, and the embedder bumps <xref href="LocalSearchEngine.Core.Crawling.Engine.EmbeddingBacklog.Processed" data-throw-if-not-resolved="false"></xref> as it drains it.

    <xref href="LocalSearchEngine.Core.Crawling.Engine.EmbeddingBacklog.Pending" data-throw-if-not-resolved="false"></xref> (the gap between them) drives the heartbeat's backlog figure, the two totals

    drive the live "embedding" progress bar and the end-of-run stat, and a separate counter is used rather

    than the channel's own <code>Count</code> because the single-reader unbounded channel does not support it.

    All members are safe to call from both threads at once.
