      path: LocalSearchEngine.Core/Crawling/Policies/RobotsRules.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: NormalizeFractionalCrawlDelays
    path: LocalSearchEngine.Core/Crawling/Policies/RobotsRules.cs
    startLine: 127
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    Rounds fractional Crawl-delay values (e.g. "0.5") up to whole seconds before parsing,

    because RobotsExclusionTools reads the directive as an integer and would otherwise drop

    them. Rewriting the value in the raw text keeps the library's user-agent group matching

    as the single authority on which group's delay applies.
  example: []
  syntax:
    content: private static string NormalizeFractionalCrawlDelays(string content)
    parameters:
    - id: content
      type: System.String
      description: The raw robots.txt content.
    return:
      type: System.String
      description: The content with fractional crawl delays rounded up to integers.
    content.vb: Private Shared Function NormalizeFractionalCrawlDelays(content As String) As String
  overload: LocalSearchEngine.Core.Crawling.Policies.RobotsRules.NormalizeFractionalCrawlDelays*
