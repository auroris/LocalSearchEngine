  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Attempts to plan an incremental run from one declared change-journal feed that covers every

    host in the run at once — the configuration for a site set where only one host can serve a

    feed (a document server has no page to advertise one on). The same boundary rule applies to

    the single feed: entries above the first already-covered one are the whole run's changes.

    A journal shaped as "everything in the window plus a tail of the most recently changed items

    before it" is self-anchoring — on a quiet day the tail is the immediate boundary, and after

    missed runs a fully-stale tail forces the full-crawl fallback all by itself.
  example: []
  syntax:
    content: public Task<IReadOnlyList<Uri>?> TryPlanDeclaredAsync(Uri feedUri, AllowedHosts scope, CancellationToken ct = default)
    parameters:
    - id: feedUri
      type: System.Uri
      description: The configured journal feed.
    - id: scope
      type: LocalSearchEngine.Core.Crawling.Policies.AllowedHosts
      description: The run's host rules; out-of-scope entries are ignored.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancels the probes.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.IReadOnlyList{System.Uri}}
      description: >-
        The changed items to crawl (possibly empty), or <code>null</code> when the feed could not
            be fetched, parsed, or bounded — a full crawl is required.
    content.vb: Public Function TryPlanDeclaredAsync(feedUri As Uri, scope As AllowedHosts, ct As CancellationToken = Nothing) As Task(Of IReadOnlyList(Of Uri))
  overload: LocalSearchEngine.Core.Crawling.Pipeline.IncrementalPlanner.TryPlanDeclaredAsync*
