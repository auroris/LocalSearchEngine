  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Searching
  summary: >-
    Performs a hybrid search (semantic vector + FTS5 keyword) for the specified query and ranks the results.

    <code>site:host</code> tokens in the query restrict results to that host and its subdomains.
  example: []
  syntax:
    content: public Task<SearchResponse> SearchAsync(string query)
    parameters:
    - id: query
      type: System.String
      description: The search query text.
    return:
