  summary: >-
    One end-of-run finding about a link the crawl resolved to something other than a clean success:

    either a broken link (its destination returned an error or could not be reached) or a redirected

    link (it still resolves, but the source should be updated). Carries both ends of the link so a

    report can say what happened and where the link was seen.
  example: []
  syntax:
    content: public BrokenLink(string Url, string? FoundOn, bool External, int StatusCode, string Reason)
    parameters:
    - id: Url
      type: System.String
      description: The link target (destination).
    - id: FoundOn
      type: System.String
      description: The page the link was seen on.
    - id: External
      type: System.Boolean
      description: Whether the target is off-site (outside the crawl's allowed hosts) rather than an in-scope page.
    - id: StatusCode
      type: System.Int32
      description: The HTTP status the target returned, or <code>0</code> if the request never completed (a connection-level failure).
    - id: Reason
      type: System.String
      description: A short human-readable explanation, e.g. "404 Not Found", "410 Gone", "connection failed", or "redirect".
