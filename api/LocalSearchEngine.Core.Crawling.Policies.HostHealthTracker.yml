  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    Records that a request to <code class="paramref">host</code> threw <code class="paramref">ex</code>. If the

    exception is a connection-level failure and the host has never answered this run, the host is

    written off as unreachable. Non-transport errors — and anything thrown because the crawl was

    cancelled — leave the tracker untouched.
  example: []
  syntax:
    content: public bool RecordFailure(string host, Exception ex, CancellationToken cancellationToken)
    parameters:
    - id: host
      type: System.String
      description: The host whose request failed.
    - id: ex
      type: System.Exception
      description: The exception the request threw.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The crawl token; a cancelled request is never a write-off.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> only on the transition into the unreachable state (so the caller can log it once);

        <code>false</code> if the failure was not a transport failure, the host had already answered, or it

        was already written off.
    content.vb: Public Function RecordFailure(host As String, ex As Exception, cancellationToken As CancellationToken) As Boolean
