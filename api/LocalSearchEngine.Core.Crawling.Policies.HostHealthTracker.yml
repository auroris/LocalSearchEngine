  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Policies
  summary: >-
    Classifies whether <code class="paramref">ex</code> is a connection-level failure that means the host

    could not be reached — a DNS/connect/TLS error, a dead socket, or a timeout. A request aborted

    because <code class="paramref">cancellationToken</code> fired is never treated as unreachable.
  example: []
  syntax:
    content: public static bool IsTransportFailure(Exception ex, CancellationToken cancellationToken)
    parameters:
    - id: ex
      type: System.Exception
      description: The thrown exception to evaluate.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Boolean
      description: <code>true</code> if the error represents an unreachable host; otherwise, <code>false</code>.
    content.vb: Public Shared Function IsTransportFailure(ex As Exception, cancellationToken As CancellationToken) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Policies.HostHealthTracker.IsTransportFailure*
