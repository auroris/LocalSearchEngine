  summary: >-
    Records a connection-level failure for <code class="paramref">host</code>. If the host has never answered

    this run, it is written off as unreachable.
  example: []
  syntax:
    content: public bool RecordUnreachable(string host)
    parameters:
    - id: host
      type: System.String
      description: The host whose connection failed.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> only on the transition into the unreachable state (so the caller can log it once);

        <code>false</code> if the host had already answered, or was already written off.
