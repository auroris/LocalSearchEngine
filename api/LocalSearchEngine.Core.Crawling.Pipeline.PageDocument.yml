    enqueue. The worker fetches it once and resolves it through <xref href="LocalSearchEngine.Core.Crawling.Pipeline.DocumentFactory" data-throw-if-not-resolved="false"></xref> into

    the typed document that actually processes the body, so type detection costs no second fetch.
