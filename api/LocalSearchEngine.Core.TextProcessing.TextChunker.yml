  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.TextProcessing
  summary: Splits the given text into overlapping chunks of a specified maximum word/token count.
  example: []
  syntax:
    content: public static IEnumerable<string> Chunk(string text, int chunkSize = 150, int overlap = 30)
    parameters:
    - id: text
      type: System.String
      description: The raw text string to split.
    - id: chunkSize
      type: System.Int32
      description: The maximum approximate word count per chunk.
    - id: overlap
      type: System.Int32
      description: The approximate word count to overlap between consecutive chunks.
    return:
      type: System.Collections.Generic.IEnumerable{System.String}
      description: An enumerable of chunk strings.
    content.vb: Public Shared Function Chunk(text As String, chunkSize As Integer = 150, overlap As Integer = 30) As IEnumerable(Of String)
