    path: LocalSearchEngine.Core/Crawling/Reporting/ICrawlObserver.cs
    startLine: 13
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Reporting
  summary: >-
    A stateful, per-crawl observer that centralizes all logging, statistics gathering, and progress

    reporting. Implementations translate crawler domain events into log messages, stat increments,

    and <xref href="LocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter" data-throw-if-not-resolved="false"></xref> callbacks, and must tolerate callbacks arriving from several

    crawl workers at once. A redirect is resolved into its own outcome on the dequeued URL (the

    target is enqueued like a link), so every other page-outcome callback names the single URL it

    resolved.
  example: []
  syntax:
    content: public interface ICrawlObserver
    content.vb: Public Interface ICrawlObserver
  derivedClasses:
  - LocalSearchEngine.Core.Crawling.Reporting.CrawlObserver
