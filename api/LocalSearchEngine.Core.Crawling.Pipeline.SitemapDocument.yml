  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    A sitemap fetch flowing through the same worker pipeline as pages, which is how it gains the

    politeness gate, host-health checks, and size caps the old dedicated service lacked. Parsing is

    hardened against hostile XML (no DTDs, no external resolution). A sitemap-index recurses by

    enqueueing child <xref href="LocalSearchEngine.Core.Crawling.Pipeline.SitemapDocument" data-throw-if-not-resolved="false"></xref>s that share one <xref href="LocalSearchEngine.Core.Crawling.Pipeline.SitemapBudget" data-throw-if-not-resolved="false"></xref>; leaf

    entries are filtered to the seed's origin and its robots rules, then enqueued as unknown pages.

    Entries go through <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)" data-throw-if-not-resolved="false"></xref>, not Discover: sitemap contents are seed

    material, so a follow-nothing plan can still crawl exactly what a sitemap lists.
  example: []
  syntax:
    content: 'internal sealed class SitemapDocument : Document'
    content.vb: Friend NotInheritable Class SitemapDocument Inherits Document
