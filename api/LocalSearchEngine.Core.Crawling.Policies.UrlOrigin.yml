  summary: >-
    Builds the cache key for a URL's origin, e.g. "http://example.com:8080".

    <xref href="System.Uri" data-throw-if-not-resolved="false"></xref> lowercases the scheme and host and resolves the scheme's default

    port, so equivalent origins always produce the same key.
  example: []
  syntax:
    content: public static string Key(Uri uri)
    parameters:
    - id: uri
      type: System.Uri
      description: The absolute URI whose origin to key.
    return:
      type: System.String
      description: The origin key string.
    content.vb: Public Shared Function Key(uri As Uri) As String
