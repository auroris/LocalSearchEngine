    path: LocalSearchEngine.Tests/FeedCrawlTests.cs
    startLine: 22
  assemblies:
  - LocalSearchEngine.Tests
  namespace: LocalSearchEngine.Tests
  summary: >-
    Drives feed-driven update crawls end to end through <xref href="LocalSearchEngine.Core.Crawling.CrawlerService.CrawlFeedAsync(System.String%2cSystem.Int32%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Collections.Generic.IEnumerable%7bSystem.String%7d%2cSystem.Int64%2cLocalSearchEngine.Core.Crawling.Reporting.ICrawlReporter%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.

    The contract under test is the update run's promise: fetch exactly what the feed lists (plus the

    origin's robots.txt), re-embed only what changed, follow nothing, and never delete anything the

    run didn't visit — so a site's rss.xml can drive cheap incremental indexing between full crawls.
