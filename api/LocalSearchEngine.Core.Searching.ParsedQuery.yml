  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Searching
  summary: >-
    Determines whether a result URL passes the site filters. A filter matches its exact

    host and any subdomain of it ("example.com" also matches "www.example.com"), on any

    port; multiple filters are OR'd. With no filters every URL passes.
  example: []
  syntax:
    content: public bool MatchesSite(string url)
    parameters:
    - id: url
      type: System.String
      description: The result URL to test.
    return:
      type: System.Boolean
      description: <code>true</code> if the URL's host satisfies the filters; otherwise, <code>false</code>.
    content.vb: Public Function MatchesSite(url As String) As Boolean
