  summary: >-
    Reduces a site filter value to a bare lowercase hostname: a pasted scheme, path,

    or port is tolerated and stripped ("https://Example.com:8080/docs" → "example.com").
  example: []
  syntax:
    content: private static string NormalizeHost(string value)
    parameters:
    - id: value
      type: System.String
      description: The raw value following <code>site:</code>.
    return:
      type: System.String
      description: The normalized hostname, or an empty string if nothing remains.
