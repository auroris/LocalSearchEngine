  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Runs the crawl to completion: start the consumer and workers, seed under the root pending

    token (so a crawl whose seeds all dedup away still terminates), wait for the workers to drain

    the frontier, then complete the index channel and wait for the consumer. A seeding failure

    still shuts the run down in order before rethrowing — abandoned workers on a never-completed

    channel would otherwise leak as a hang.
  example: []
  syntax:
    content: public Task<PipelineResult> RunAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancels the run.
    return:
      type: System.Threading.Tasks.Task{LocalSearchEngine.Core.Crawling.Pipeline.PipelineResult}
      description: The run's tallies for the facade's report and prune decision.
    content.vb: Public Function RunAsync(ct As CancellationToken = Nothing) As Task(Of PipelineResult)
  overload: LocalSearchEngine.Core.Crawling.Pipeline.CrawlPipeline.RunAsync*
