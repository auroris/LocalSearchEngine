  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    The crawl engine: two channels and the shared state between them. Documents flow through an

    unbounded crawl channel into N workers; classified <xref href="LocalSearchEngine.Core.Crawling.Engine.CrawlJob" data-throw-if-not-resolved="false"></xref>s flow through an

    unbounded index channel into the single <xref href="LocalSearchEngine.Core.Crawling.Pipeline.PersistenceConsumer" data-throw-if-not-resolved="false"></xref>. Both channels are

    unbounded on purpose — workers are also producers, so a bounded crawl channel would deadlock the

    moment every worker blocked writing children into a full queue, and the index channel must never

    make a worker wait on the (much slower) embedder.


    Termination is the <xref href="LocalSearchEngine.Core.Crawling.Pipeline.PendingWorkCounter" data-throw-if-not-resolved="false"></xref> refcount, not channel emptiness: the worker

    that decrements it to zero completes the crawl channel, the orchestrator completes the index

    channel once all workers exit, and the run ends when the consumer drains. <xref href="LocalSearchEngine.Core.Crawling.Pipeline.CrawlPipeline.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)" data-throw-if-not-resolved="false"></xref>

    is the only frontier entrance, so the scope filter, the seen-claim, and the refcount can never

    disagree with each other.
  example: []
  syntax:
    content: internal sealed class CrawlPipeline
    content.vb: Friend NotInheritable Class CrawlPipeline
