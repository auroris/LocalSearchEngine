    parameters:
    - id: contentHash
      type: System.String
      description: The candidate's extracted-content hash.
    - id: url
      type: System.String
      description: The candidate URL.
    - id: duplicateOf
      type: System.String
      description: >-
        Receives the accepted same-run owner when this is a duplicate;
            otherwise <code>null</code>, including when the cap rejected the candidate.
    return:
      type: System.Boolean
      description: <code>true</code> when the candidate owns a reserved index slot.
    content.vb: Friend Function TryAcceptIndex(contentHash As String, url As String, duplicateOf As String) As Boolean
