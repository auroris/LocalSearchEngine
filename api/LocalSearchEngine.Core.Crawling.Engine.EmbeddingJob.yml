  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Engine
  summary: >-
    Builds the chunk work implied by a finished <xref href="LocalSearchEngine.Core.Crawling.Engine.CrawlJob" data-throw-if-not-resolved="false"></xref>, or <code>null</code> when the job

    touches no chunks at all (an unchanged page) and need not be queued.
  example: []
  syntax:
    content: public static EmbeddingJob? From(CrawlJob job)
    parameters:
    - id: job
      type: LocalSearchEngine.Core.Crawling.Engine.CrawlJob
      description: The classified job the crawler has just applied to crawl-state.
    return:
      type: LocalSearchEngine.Core.Crawling.Engine.EmbeddingJob
      description: The matching chunk work, or <code>null</code> if there is nothing for the embedder to do.
    content.vb: Public Shared Function From(job As CrawlJob) As EmbeddingJob
