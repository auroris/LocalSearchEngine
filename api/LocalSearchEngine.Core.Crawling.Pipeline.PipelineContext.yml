    id: TryAcceptIndex
    path: LocalSearchEngine.Core/Crawling/Pipeline/PipelineContext.cs
    startLine: 41
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Atomically resolves same-run duplicate ownership and reserves one index slot. Two workers

    indexing identical content at once resolve to one accepted index entry and one alias;

    distinct pages cannot exceed the run's global page cap or their host's per-host cap.
  example: []
  syntax:
    content: public bool TryAcceptIndex(string contentHash, string url, out string? duplicateOf)
    parameters:
    - id: contentHash
      type: System.String
      description: The extracted-content hash.
    - id: url
      type: System.String
      description: The URL claiming it.
    - id: duplicateOf
      type: System.String
      description: >-
        Receives the accepted owner when this is a same-run duplicate;
            otherwise <code>null</code>, including when a cap rejected the candidate.
    return:
      type: System.Boolean
      description: <code>true</code> if the URL owns a reserved index slot; otherwise, <code>false</code>.
    content.vb: Public Function TryAcceptIndex(contentHash As String, url As String, duplicateOf As String) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.TryAcceptIndex*
  implements:
