  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Offers a link discovered on a page (or stored from a previous visit) to the frontier.

    A no-op returning <code>false</code> when <xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.FollowLinks" data-throw-if-not-resolved="false"></xref> is off — this is the one

    switch that keeps a feed run from turning into a crawl.
  example: []
  syntax:
    content: public bool Discover(Uri fetchUri)
    parameters:
    - id: fetchUri
      type: System.Uri
      description: The exact resolved link target.
    return:
      type: System.Boolean
      description: <code>true</code> if the link was new, in scope, and enqueued.
    content.vb: Public Function Discover(fetchUri As Uri) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.Discover*
  implements:
  - LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.Discover(System.Uri)
- uid: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.DiscoverFeed(System.Uri)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.DiscoverFeed(System.Uri)
  id: DiscoverFeed(System.Uri)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext
