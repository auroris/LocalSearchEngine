  type: Method
  source:
    remote:
      path: LocalSearchEngine.Core/Crawling/Pipeline/PipelineContext.cs
      branch: main
      repo: https://github.com/auroris/LocalSearchEngine.git
    id: DiscoverFeed
    path: LocalSearchEngine.Core/Crawling/Pipeline/PipelineContext.cs
    startLine: 35
  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Pipeline
  summary: >-
    Offers a feed a page advertises to the frontier as extra seed material — a positive signal

    only: whatever the feed lists is guaranteed into the frontier, but a URL's absence from a

    feed never suppresses anything (feeds are windows onto the newest items, so absence proves

    nothing). Gated like link expansion (<xref href="LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.FollowLinks" data-throw-if-not-resolved="false"></xref>) and by a small per-run

    budget, because platforms advertise a per-post comments feed on every post and an unbounded

    crawl of those buys nothing.
  example: []
  syntax:
    content: public bool DiscoverFeed(Uri feedUri)
    parameters:
    - id: feedUri
      type: System.Uri
      description: The exact resolved feed target.
    return:
      type: System.Boolean
      description: <code>true</code> if the feed was new, in scope, within budget, and enqueued.
    content.vb: Public Function DiscoverFeed(feedUri As Uri) As Boolean
  overload: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.DiscoverFeed*
  implements:
  - LocalSearchEngine.Core.Crawling.Pipeline.ICrawlContext.DiscoverFeed(System.Uri)
- uid: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  commentId: M:LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext.Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  id: Enqueue(LocalSearchEngine.Core.Crawling.Pipeline.Document)
  parent: LocalSearchEngine.Core.Crawling.Pipeline.PipelineContext
