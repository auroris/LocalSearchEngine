  assemblies:
  - LocalSearchEngine.Core
  namespace: LocalSearchEngine.Core.Crawling.Extraction
  summary: >-
    True when the extracted text isn't worth indexing: either the PDF has no text layer at all

    (<xref href="LocalSearchEngine.Core.Crawling.Extraction.ContentExtractor.PdfExtraction.TotalGlyphs" data-throw-if-not-resolved="false"></xref> is 0 — typically a scanned image), or too few of its glyphs are

    Unicode-mappable (a broken/subset font encoding). Both are candidates for an OCR fallback.
