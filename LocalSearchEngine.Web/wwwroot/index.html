<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Vector Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="local-search-app" class="local-search-app">
        <header class="app-header">
            <h1 class="app-title">Search</h1>
        </header>

        <section class="search-section">
            <form data-lse-search-form>
                <div class="search-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" data-lse-search-input placeholder="Ask a question or search for concepts... (site:example.com to filter)" required autocomplete="off">
                    <button type="submit" class="primary-btn">Search</button>
                </div>
            </form>
        </section>

        <section class="results-section" data-lse-results aria-live="polite">
            <!-- Results will be injected here -->
        </section>

        <footer class="stats-footer" data-lse-stats>
            <!-- Index summary loads here; stays empty if no index exists yet -->
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
